function renderTable() {
    const total = currentRecords.length;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, total);
    const pageRecords = currentRecords.slice(start, end);
    
    resultCount.textContent = total;
    
    let html = '';
    pageRecords.forEach(r => {
        html += `<tr><td>${r.vin}</td><td>${r.material}</td><td>${r.invoice_date}</td><td>${r.dealer}</td></tr>`;
    });
    tableBody.innerHTML = html;
    
    // 分页
    let pagHtml = '';
    if (totalPages > 1) {
        pagHtml += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;
        
        const maxButtons = 7;
        let startPage, endPage;
        if (totalPages <= maxButtons) {
            startPage = 1;
            endPage = totalPages;
        } else {
            const half = Math.floor(maxButtons / 2);
            if (currentPage <= half + 1) {
                startPage = 1;
                endPage = maxButtons;
            } else if (currentPage >= totalPages - half) {
                startPage = totalPages - maxButtons + 1;
                endPage = totalPages;
            } else {
                startPage = currentPage - half;
                endPage = currentPage + half;
            }
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pagHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        }
        
        pagHtml += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
        pagHtml += `<span class="page-info">共 ${totalPages} 页</span>`;
    }
    pagination.innerHTML = pagHtml;
}

function goPage(page) {
    currentPage = page;
    renderTable();
    window.scrollTo({ top: results.offsetTop - 20, behavior: 'smooth' });
}
