const PAGE_SIZE = 100;

// 初始化: 填充车型下拉
const carModelSelect = document.getElementById('carModel');
const versionSelect = document.getElementById('version');
const colorSelect = document.getElementById('color');
const guide = document.getElementById('guide');
const results = document.getElementById('results');
const tableBody = document.getElementById('tableBody');
const resultCount = document.getElementById('resultCount');
const pagination = document.getElementById('pagination');

let currentPage = 1;
let currentRecords = [];

// 填充车型
const models = Object.keys(HIERARCHY);
models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    carModelSelect.appendChild(opt);
});
carModelSelect.disabled = false;

carModelSelect.addEventListener('change', function() {
    const model = this.value;
    versionSelect.innerHTML = '<option value="">请选择版型</option>';
    colorSelect.innerHTML = '<option value="">请选择外观颜色</option>';
    colorSelect.disabled = true;
    results.style.display = 'none';
    
    if (!model) {
        versionSelect.disabled = true;
        guide.classList.remove('hidden');
        return;
    }
    
    const versions = Object.keys(HIERARCHY[model]);
    versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        versionSelect.appendChild(opt);
    });
    versionSelect.disabled = false;
    guide.classList.remove('hidden');
});

versionSelect.addEventListener('change', function() {
    const model = carModelSelect.value;
    const version = this.value;
    colorSelect.innerHTML = '<option value="">请选择外观颜色</option>';
    results.style.display = 'none';
    
    if (!version) {
        colorSelect.disabled = true;
        guide.classList.remove('hidden');
        return;
    }
    
    const colors = Object.keys(HIERARCHY[model][version]);
    colors.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        colorSelect.appendChild(opt);
    });
    colorSelect.disabled = false;
    guide.classList.remove('hidden');
});

colorSelect.addEventListener('change', function() {
    const model = carModelSelect.value;
    const version = versionSelect.value;
    const color = this.value;
    
    if (!color) {
        results.style.display = 'none';
        guide.classList.remove('hidden');
        return;
    }
    
    const indices = HIERARCHY[model][version][color];
    currentRecords = indices.map(i => RECORDS[i]);
    currentPage = 1;
    guide.classList.add('hidden');
    results.style.display = 'block';
    renderTable();
});

function renderTable() {
    const total = currentRecords.length;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, total);
    const pageRecords = currentRecords.slice(start, end);
    
    resultCount.textContent = total;
    
    let html = '';
    pageRecords.forEach(r => {
        html += `<tr><td>${r.vin}</td><td>${r.material}</td><td>${r.invoice_date}</td><td>${r.dealer}</td></tr>`;
    });
    tableBody.innerHTML = html;
    
    // 分页
    let pagHtml = '';
    if (totalPages > 1) {
        pagHtml += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;
        
        const maxButtons = 7;
        let startPage, endPage;
        if (totalPages <= maxButtons) {
            startPage = 1;
            endPage = totalPages;
        } else {
            const half = Math.floor(maxButtons / 2);
            if (currentPage <= half + 1) {
                startPage = 1;
                endPage = maxButtons;
            } else if (currentPage >= totalPages - half) {
                startPage = totalPages - maxButtons + 1;
                endPage = totalPages;
            } else {
                startPage = currentPage - half;
                endPage = currentPage + half;
            }
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pagHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        }
        
        pagHtml += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
        pagHtml += `<span class="page-info">共 ${totalPages} 页</span>`;
    }
    pagination.innerHTML = pagHtml;
}

function goPage(page) {
    currentPage = page;
    renderTable();
    window.scrollTo({ top: results.offsetTop - 20, behavior: 'smooth' });
}
</script>
