const PAGE_SIZE = 100;
let filtered = [];
let curPage = 1;

const selModel = document.getElementById('selModel');
const selEdition = document.getElementById('selEdition');
const selColor = document.getElementById('selColor');
const guide = document.getElementById('guide');
const resultArea = document.getElementById('resultArea');
const tbody = document.getElementById('tbody');
const resultInfo = document.getElementById('resultInfo');
const pageInfo = document.getElementById('pageInfo');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

// 初始化车型下拉
Object.keys(HIERARCHY).sort().forEach(m => {
  const opt = document.createElement('option');
  opt.value = m; opt.textContent = m;
  selModel.appendChild(opt);
});

function resetSelect(sel, placeholder) {
  sel.innerHTML = '<option value="">' + placeholder + '</option>';
  sel.disabled = true;
}

function hideResult() {
  guide.classList.remove('hidden');
  resultArea.classList.add('hidden');
}

selModel.addEventListener('change', () => {
  resetSelect(selEdition, '请选择版型');
  resetSelect(selColor, '请选择外观颜色');
  hideResult();
  if (!selModel.value) return;
  const editions = Object.keys(HIERARCHY[selModel.value]).sort();
  editions.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e; opt.textContent = e;
    selEdition.appendChild(opt);
  });
  selEdition.disabled = false;
});

selEdition.addEventListener('change', () => {
  resetSelect(selColor, '请选择外观颜色');
  hideResult();
  if (!selEdition.value) return;
  const colors = HIERARCHY[selModel.value][selEdition.value];
  colors.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    selColor.appendChild(opt);
  });
  selColor.disabled = false;
});

selColor.addEventListener('change', () => {
  if (!selColor.value) { hideResult(); return; }
  filtered = DATA.filter(r => r[0] === selModel.value && r[1] === selEdition.value && r[2] === selColor.value);
  curPage = 1;
  render();
});

function render() {
  guide.classList.add('hidden');
  resultArea.classList.remove('hidden');
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (curPage > totalPages) curPage = totalPages;
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = filtered.slice(start, start + PAGE_SIZE);
  resultInfo.textContent = '共 ' + total + ' 条记录';
  tbody.innerHTML = rows.map(r =>
    '<tr><td class="vin">' + r[3] + '</td><td>' + r[4] + '</td><td>' + (r[5] || '-') + '</td><td>' + r[6] + '</td></tr>'
  ).join('');
  pageInfo.textContent = curPage + ' / ' + totalPages;
  btnPrev.disabled = curPage <= 1;
  btnNext.disabled = curPage >= totalPages;
  document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
}

btnPrev.addEventListener('click', () => { if (curPage > 1) { curPage--; render(); window.scrollTo(0,0); } });
btnNext.addEventListener('click', () => { curPage++; render(); window.scrollTo(0,0); });
</script>
