var PAGE_SIZE = 100;
var currentPage = 1;
var filteredRecords = [];
var allColorSet = new Set();

// 初始化
(function init() {
    // 收集所有颜色
    RECORDS.forEach(function(r) {
        if (r.color) allColorSet.add(r.color);
    });
    document.getElementById("totalCount").textContent = RECORDS.length;
    document.getElementById("colorCount").textContent = allColorSet.size;

    // 填充车型下拉
    var carSelect = document.getElementById("carSelect");
    Object.keys(HIERARCHY).forEach(function(car) {
        var opt = document.createElement("option");
        opt.value = car;
        opt.textContent = car;
        carSelect.appendChild(opt);
    });

    // 默认显示全部
    applyFilter();
})();

function onCarChange() {
    var car = document.getElementById("carSelect").value;
    var verSelect = document.getElementById("versionSelect");
    var colSelect = document.getElementById("colorSelect");

    verSelect.innerHTML = '<option value="">全部版型</option>';
    colSelect.innerHTML = '<option value="">全部颜色</option>';
    colSelect.disabled = true;

    if (car && HIERARCHY[car]) {
        verSelect.disabled = false;
        Object.keys(HIERARCHY[car]).forEach(function(ver) {
            var opt = document.createElement("option");
            opt.value = ver;
            opt.textContent = ver;
            verSelect.appendChild(opt);
        });
    } else {
        verSelect.disabled = true;
    }
    currentPage = 1;
    applyFilter();
}

function onVersionChange() {
    var car = document.getElementById("carSelect").value;
    var ver = document.getElementById("versionSelect").value;
    var colSelect = document.getElementById("colorSelect");

    colSelect.innerHTML = '<option value="">全部颜色</option>';

    if (car && ver && HIERARCHY[car] && HIERARCHY[car][ver]) {
        colSelect.disabled = false;
        HIERARCHY[car][ver].forEach(function(col) {
            var opt = document.createElement("option");
            opt.value = col;
            opt.textContent = col;
            colSelect.appendChild(opt);
        });
    } else {
        colSelect.disabled = true;
    }
    currentPage = 1;
    applyFilter();
}

function onColorChange() {
    currentPage = 1;
    applyFilter();
}

function applyFilter() {
    var car = document.getElementById("carSelect").value;
    var ver = document.getElementById("versionSelect").value;
    var col = document.getElementById("colorSelect").value;

    filteredRecords = RECORDS.filter(function(r) {
        if (car && r.car_model !== car) return false;
        if (ver && r.version !== ver) return false;
        if (col && r.color !== col) return false;
        return true;
    });

    document.getElementById("filteredCount").textContent = filteredRecords.length;
    renderTable();
    renderPagination();
}

function renderTable() {
    var tbody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (filteredRecords.length === 0) {
        tbody.innerHTML = "";
        emptyState.style.display = "block";
        return;
    }
    emptyState.style.display = "none";

    var start = (currentPage - 1) * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, filteredRecords.length);
    var pageRecords = filteredRecords.slice(start, end);

    var html = "";
    pageRecords.forEach(function(r, i) {
        var idx = start + i + 1;
        var vinDisplay = r.vin.length > 8 ? r.vin.substring(0, 4) + "****" + r.vin.substring(r.vin.length - 4) : r.vin;
        html += '<tr>';
        html += '<td>' + idx + '</td>';
        html += '<td>' + escapeHtml(r.car_model) + '</td>';
        html += '<td>' + escapeHtml(r.version) + '</td>';
        html += '<td class="color-tag"><span class="color-dot" style="background:' + getColorHex(r.color) + '"></span>' + escapeHtml(r.color || "-") + '</td>';
        html += '<td class="vin">' + vinDisplay + '</td>';
        html += '<td>' + escapeHtml(r.bill_date || "-") + '</td>';
        html += '<td>' + escapeHtml(r.dealer) + '</td>';
        html += '</tr>';
    });
    tbody.innerHTML = html;
}

function renderPagination() {
    var totalPages = Math.ceil(filteredRecords.length / PAGE_SIZE) || 1;
    var pagDiv = document.getElementById("pagination");

    var html = '<button onclick="goPage(1)" ' + (currentPage <= 1 ? "disabled" : "") + '>首页</button>';
    html += '<button onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? "disabled" : "") + '>上一页</button>';
    html += '<span class="page-info">第 <input type="number" class="page-input" id="pageInput" value="' + currentPage + '" min="1" max="' + totalPages + '" onkeydown="if(event.key==='Enter')goPage(parseInt(this.value))"> / ' + totalPages + ' 页</span>';
    html += '<button onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? "disabled" : "") + '>下一页</button>';
    html += '<button onclick="goPage(' + totalPages + ')" ' + (currentPage >= totalPages ? "disabled" : "") + '>末页</button>';
    html += '<span class="page-info" style="margin-left:12px">共 ' + filteredRecords.length + ' 条</span>';
    pagDiv.innerHTML = html;
}

function goPage(p) {
    var totalPages = Math.ceil(filteredRecords.length / PAGE_SIZE) || 1;
    p = Math.max(1, Math.min(p, totalPages));
    currentPage = p;
    renderTable();
    renderPagination();
}

function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}
