*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px;font-weight:600}
.header .stats{font-size:12px;opacity:.8;margin-top:4px}
.container{padding:12px;max-width:1400px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;min-width:150px;flex:1;max-width:280px}
.filter-group label{font-size:12px;color:#666;margin-bottom:4px;font-weight:500}

.filter-group select:focus{border-color:#1a237e}
.filter-group select:disabled{background:#f0f0f0;color:#999;cursor:not-allowed}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead{position:sticky;top:0;z-index:1}
th{background:#f8f9fb;color:#555;font-weight:600;padding:12px 14px;text-align:left;border-bottom:2px solid #e0e0e0;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0;color:#444}
tr:hover td{background:#f5f7ff}
tr:nth-child(even) td{background:#fafbfc}
tr:nth-child(even):hover td{background:#f5f7ff}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px 0;flex-wrap:wrap}
.pagination button{padding:8px 14px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;color:#333;transition:all .15s}
.pagination button:hover:not(:disabled){background:#1a237e;color:#fff;border-color:#1a237e}
.pagination button:disabled{opacity:.4;cursor:default}
.pagination .active{background:#1a237e;color:#fff;border-color:#1a237e;font-weight:600}
.pagination .info{font-size:12px;color:#888;margin:0 8px}
.no-data{text-align:center;padding:60px 20px;color:#999;font-size:15px}
.no-data svg{display:block;margin:0 auto 16px;opacity:.35}
.loading{text-align:center;padding:40px;color:#888}
@media(max-width:600px){
.filters{gap:6px}
.filter-group{min-width:100px;max-width:none}
th,td{padding:8px 10px;font-size:11px}
.header h1{font-size:16px}
}
</style>

var COLS = ["车型","版型","颜色","VIN","物料名称","开票日期","经销商","省份"];
var PAGE_SIZE = 100;
var currentPage = 1;
var filteredRecords = [];
var selectedCar = "";
var selectedVersion = "";
var selectedColor = "";
var allThreeSelected = false;

document.addEventListener("DOMContentLoaded",function(){
initCarSelect();
filterAndRender();
});

function initCarSelect(){
var sel = document.getElementById("carModel");
sel.innerHTML = '<option value="">请选择车型</option>';
sel.disabled = false;
var cars = Object.keys(HIERARCHY).sort();
cars.forEach(function(c){
var opt = document.createElement("option");
opt.value = c;
opt.textContent = c;
sel.appendChild(opt);
});
sel.addEventListener("change",function(){
selectedCar = this.value;
selectedVersion = "";
selectedColor = "";
initVersionSelect();
filterAndRender();
});
}

function initVersionSelect(){
var vs = document.getElementById("version");
vs.innerHTML = '<option value="">请选择版型</option>';
if(!selectedCar){ vs.disabled = true; return; }
vs.disabled = false;
var versions = Object.keys(HIERARCHY[selectedCar] || {}).sort();
versions.forEach(function(v){
var opt = document.createElement("option");
opt.value = v;
opt.textContent = v;
vs.appendChild(opt);
});
vs.addEventListener("change",function(){
selectedVersion = this.value;
selectedColor = "";
initColorSelect();
filterAndRender();
});
document.getElementById("color").innerHTML = '<option value="">请选择颜色</option>';
document.getElementById("color").disabled = true;
}

function initColorSelect(){
var cs = document.getElementById("color");
cs.innerHTML = '<option value="">请选择颜色</option>';
if(!selectedCar || !selectedVersion){ cs.disabled = true; return; }
cs.disabled = false;
var colors = (HIERARCHY[selectedCar]||{})[selectedVersion] || [];
colors.forEach(function(c){
var opt = document.createElement("option");
opt.value = c;
opt.textContent = c;
cs.appendChild(opt);
});
cs.addEventListener("change",function(){
selectedColor = this.value;
filterAndRender();
});
}

function filterAndRender(){
if(!selectedCar || !selectedVersion || !selectedColor){
allThreeSelected = false;
filteredRecords = [];
}else{
allThreeSelected = true;
filteredRecords = RECORDS.filter(function(r){
// r = [车型,版型,颜色,VIN,物料名称,开票日期,经销商,省份]
// 数据已预过滤，仅包含北京市
if(selectedCar && r[0] !== selectedCar) return false;
if(selectedVersion && r[1] !== selectedVersion) return false;
if(selectedColor && r[2] !== selectedColor) return false;
return true;
});
}
currentPage = 1;
renderTable();
}

function renderTable(){
var total = filteredRecords.length;
var totalPages = Math.ceil(total / PAGE_SIZE) || 1;
if(currentPage > totalPages) currentPage = totalPages;
if(currentPage < 1) currentPage = 1;
var start = (currentPage - 1) * PAGE_SIZE;
var end = Math.min(start + PAGE_SIZE, total);
var pageData = filteredRecords.slice(start, end);

document.getElementById("stats").textContent =
    "仅限北京市 | " +
    (allThreeSelected ? "共 " + total.toLocaleString() + " 条记录" : "请依次选择车型、版型、外观颜色") +
    (selectedCar ? " | 车型: " + selectedCar : "") +
    (selectedVersion ? " | 版型: " + selectedVersion : "") +
    (selectedColor ? " | 颜色: " + selectedColor : "");

var html = '';
if(total === 0){
if(!allThreeSelected){
html = '<div class="no-data"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>请依次选择车型、版型、外观颜色</div>';
}else{
html = '<div class="no-data"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>暂无符合条件的数据</div>';
}
}else{
html = '<div class="table-wrap"><table><thead><tr><th>VIN码</th><th>物料名称</th><th>开票日期</th><th>经销商</th></tr></thead><tbody>';
pageData.forEach(function(r){
html += '<tr><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td><td>' + esc(r[5]) + '</td><td>' + esc(r[6]) + '</td></tr>';
});
html += '</tbody></table></div>';
}
document.getElementById("tableArea").innerHTML = html;
renderPagination(totalPages, total);
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderPagination(totalPages, total){
var pg = document.getElementById("pagination");
if(totalPages <= 1){ pg.innerHTML = '<span class="info">共 ' + total.toLocaleString() + ' 条，第 ' + currentPage + ' 页</span>'; return; }
var h = '';
h += '<span class="info">共 ' + total.toLocaleString() + ' 条，' + totalPages + ' 页</span>';
h += '<button ' + (currentPage<=1?'disabled':'') + ' onclick="goPage(1)">首页</button>';
h += '<button ' + (currentPage<=1?'disabled':'') + ' onclick="goPage(' + (currentPage-1) + ')">上一页</button>';
var s = Math.max(1, currentPage - 3);
var e = Math.min(totalPages, currentPage + 3);
if(s > 1) h += '<span>...</span>';
for(var i = s; i <= e; i++){
h += '<button class="' + (i===currentPage?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
}
if(e < totalPages) h += '<span>...</span>';
h += '<button ' + (currentPage>=totalPages?'disabled':'') + ' onclick="goPage(' + (currentPage+1) + ')">下一页</button>';
h += '<button ' + (currentPage>=totalPages?'disabled':'') + ' onclick="goPage(' + totalPages + ')">末页</button>';
pg.innerHTML = h;
}

function goPage(p){
currentPage = p;
renderTable();
window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
